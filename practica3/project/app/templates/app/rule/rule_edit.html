{% extends 'app/base.html' %}
{% block content %}
<h3>Editar Regla '{{ form.instance.name }}'</h3>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Guardar Cambios</button>
</form>
<p><a href="{% url 'app:rules' %}">Cancelar</a></p>
{% endblock %}
