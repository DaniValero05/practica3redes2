{% extends 'app/base.html' %}

{% block content %}
<h2>Añadir Switch</h2>

<div class="card mt-4" style="max-width: 600px;">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            
            <div class="mt-4">
                <button type="submit" class="btn btn-primary"><i class="bi-save"></i> Guardar Switch</button>
                <a href="{% url 'app:device_new' %}" class="btn btn-secondary">Volver al menú</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
